<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="weather-app">
            <div class="input-box">
                <input type="text" placeholder="enter city name">
               <button class="search-btn"><img src="images/search.png" alt="" class="search"></button>
            </div>
            <div class="weather-img-div"><img src="images/rain.png" alt="" class="weather-img"></div>
            <h3 class="temperature">22°C</h3>
            <h3 class="city">Bengaluru</h3>
            <div class="humidity-wind">
                <div class="humidity">
                    <img src="images/humidity.png" alt="" class="humidity-image">
                    <p class="humidity-percentage">50%<br>Humidity</p>
                </div>
                <div class="wind">
                    <img src="images/wind.png" alt="" class="wind-image">
                    <p class="wind-speed">15km/h<br>wind speed</p>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
